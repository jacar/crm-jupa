version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crm_jupa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "apk add --no-cache openssl && cd apps/api && npx prisma db push && (npm run prisma:seed || true) && cd /app && npm run start:prod --workspace=@crm/api"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/crm_jupa?schema=public
      - JWT_SECRET=supersecret123
      - JWT_REFRESH_SECRET=superrefreshsecret123
      - PORT=4000
    ports:
      - '4000:4000'
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://100.57.3.187:4000/api
    environment:
      - NEXT_PUBLIC_API_URL=http://100.57.3.187:4000/api
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
